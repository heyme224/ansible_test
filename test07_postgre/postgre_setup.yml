# test07_postgre/postgre_setup.yml
---
- name: Postgre 설치 및 셋업 (Rocky Linux 전용)
  hosts: 172.16.1.202
  become: yes

  # 환경변수설정 (생성할 db 의 이름, 계정, 비밀번호 등을 제어 합니다)
  vars:
    db_name: "scott_db"
    db_user: "scott"
    db_pass: "tiger"
    pg_data_dir: "/var/lib/pgsql/data"
    pg_hba_path: "{{ pg_data_dir }}/pg_hba.conf"
    pg_conf_path: "{{ pg_data_dir }}/postgresql.conf"

  tasks:
    - name: 1. 필수 페키지 설치
      dnf:
        name:
          - postgresql-server # postgre 본체
          - postgresql-contrib # 확장기능 contibution
          - python3-psycopg2 # ansible 이 DB 를 제어하기 위한 라이브러리
        state: present

    - name: 2. DB 초기화
      command: postgresql-setup --initdb
      args:
        creates: "{{ pg_data_dir }}/PG_VERSION" # 이 파일이 있으면 initdb 를 실행하지 않음

    - name: 3. 외부 접속 허용 (listen_addresses)
      lineinfile:
        path: "{{ pg_conf_path }}"
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
        state: present
      notify: restart_postgre

    - name: 4. locahost 에서 비밀번호로 접속 할수 있게 허용
      replace:
        path: "{{ pg_hba_path }}"
        regexp: '^(host\s+all\s+all\s+(127\.0\.0\.1\/32|::1\/128)\s+)(ident|scram-sha-256|trust|peer)$'
        replace: '\1md5'
      notify: restart_postgre

    - name: 5. 외부 아이피 대역 (0.0.0.0/0) md5 접속 허용 룰 추가
      lineinfile:
        path: "{{ pg_hba_path }}"
        line: "host     all     all     0.0.0.0/0     md5"
        insertafter: EOF
      notify: restart_postgre

    - name: 6. postgre 서비스 시작 및 재부팅시 자동 실행 설정
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: 7. 사용자 계정 생성 및 비밀번호 부여
      postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
      become: yes
      become_user: postgres

    - name: 8. 신규 db 생성 및 소유권 부여
      postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become: yes
      become_user: postgres

    - name: 9. postgres 슈퍼 유저 비밀번호 설정
      postgresql_user:
        name: postgres
        password: "postgres"
      become: yes
      become_user: postgres

  handlers:
    - name: restart_postgre
      systemd:
        name: postgresql
        state: restarted