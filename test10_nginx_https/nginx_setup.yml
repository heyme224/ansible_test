# nginx_setup.yml
---
- name: "1단계: Nginx 기본 웹서버 설치"
  hosts: aws_amazon  # 타겟 일치
  become: yes

  vars:
    nginx_vhosts:
      # 아직 HTTPS가 없으므로 80포트로만 기본 세팅
      - listen: "80"
        server_name: "heyme.store www.heyme.store"
        root: "/usr/share/nginx/html"
        index: "index.html index.htm"
 
  roles:
    - geerlingguy.nginx